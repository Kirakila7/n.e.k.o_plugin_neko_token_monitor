[plugin]
id = "neko_token_monitor"
name = "猫粮"
description = "YUI 桌面猫粮挂件：支持 DeepSeek Harness 账户余额与应用内充值、TRAE/WorkBuddy 本机积分面板（macOS）、DeepSeek/Kimi API 余额、Qwen 阿里云账户额度、Codex 套餐、GPT/Claude 预算及手动积分记录；配合脸色、跳动、追逐、互动记忆和低粮提醒。各来源标明自动/手动与数据是否过期。"
short_description = "YUI companion with configurable balance sources and explicitly estimated budgets."
version = "0.8.25"
entry = "plugin.plugins.neko_token_monitor:NekoTokenMonitorPlugin"

[plugin.author]
name = "acekira3-afk"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = true
